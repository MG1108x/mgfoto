# Aktualisiert automatisch das Bilder-Verzeichnis (images-manifest.json),
# sobald Fotos im Ordner /images hinzukommen oder entfernt werden.
# Kann zusätzlich von Hand gestartet werden: Tab "Actions" → diesen
# Workflow wählen → "Run workflow".
name: Galerie-Manifest aktualisieren

on:
  push:
    paths:
      - 'images/**'
    branches:
      - main
  workflow_dispatch:

# Läuft immer nur einmal gleichzeitig; ein neuer Lauf ersetzt den alten.
concurrency:
  group: gallery-manifest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Manifest erzeugen
        run: node scripts/build-manifest.js

      - name: Änderungen committen (falls vorhanden)
        run: |
          if [ -n "$(git status --porcelain images-manifest.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add images-manifest.json
            git commit -m "Galerie-Manifest automatisch aktualisiert"
            # Neuesten Stand holen, eigenen Commit obendrauf setzen, dann pushen.
            # Mehrere Versuche, falls parallel weitere Uploads laufen.
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push-Versuch $i fehlgeschlagen, neuer Versuch..."
              sleep 3
            done
          else
            echo "Keine Änderung am Manifest."
          fi
